# Voyager Whisper for CasaOS (optional): transcribes the voice notes recorded in Voyager (ROADMAP item 33,
# DESIGN §5.24). A SECOND custom app next to Voyager (casaos-compose.yml): paste this into App Store → Custom
# Install → Import, then set NOTES_TRANSCRIPTION_URL to http://127.0.0.1:18097 in Voyager's settings
# (docs/CASAOS.md "Voice note transcription"). Recording works without it; this adds the text.
#
# whisper-asr-webservice (MIT) with faster-whisper on the CPU. Like Voyager it shares the host's network and listens
# on the host's loopback only (127.0.0.1:18097), so only Voyager and the host reach it, nothing on the LAN or the
# tailnet; it keeps no audio. The model is downloaded on the first start (about 0.5 GB for small)
# into /DATA/AppData/notesapp/whisper. The image itself is large (about 2.7 GB on amd64).
#   ASR_MODEL    base: fast on a small CPU · small (default): better · medium: best here, slow without a strong CPU
name: notesapp-whisper

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.10.0@sha256:0616c3d5fc6924e9d59aa8a7a3a944fbe8f3a5d701e5fc1fa2ce5b933dfecb73
    container_name: notesapp-whisper
    network_mode: host                          # Voyager (also on the host's network) reaches http://127.0.0.1:18097
    command: ["--host", "127.0.0.1", "--port", "18097"]   # the image's whisper-asr-webservice: loopback only
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: small
      ASR_MODEL_PATH: /data/whisper
      MODEL_IDLE_TIMEOUT: "900"                 # frees the model's memory after 15 idle minutes
    volumes:
      - /DATA/AppData/notesapp/whisper:/data/whisper
    mem_limit: 3g
    logging: *logging
    restart: unless-stopped

x-casaos:
  architectures:
    - amd64
    - arm64
  main: whisper
  author: rjgehan
  category: Utilities
  title:
    en_us: Voyager Whisper
  tagline:
    en_us: Transcription of Voyager voice notes
  description:
    en_us: A local Whisper speech-to-text service for Voyager's voice notes. It listens on the host's loopback only. Set NOTES_TRANSCRIPTION_URL to http://127.0.0.1:18097 in Voyager's settings after installing (docs/CASAOS.md).
  icon: https://raw.githubusercontent.com/rjgehan/notesapp/main/frontend/public/icon-192.png
