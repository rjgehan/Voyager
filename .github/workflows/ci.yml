name: CI
on:
  pull_request:
  push:
    branches: [main]
    # Docs-only pushes must not restart production, except the user guide: the app's Help page bundles docs/guide.
    paths: ['**', '!docs/**', 'docs/guide/**', '!README.md']
  schedule:
    - cron: '0 6 * * 1'                     # weekly: rebuild with fresh base images and pick up security fixes
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sh ./mvnw -B -ntp verify

  backend-jdk25:                             # the jar is built for Java 21 but runs on JDK 25 in the image (DESIGN §7.1)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sh ./mvnw -B -ntp verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lockfile contains the Linux native bindings (npm/cli#4828)
        run: grep -q '"node_modules/@rolldown/binding-linux-x64-gnu"' package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx vite build --mode demo         # the GitHub Pages demo (pages.yml, DESIGN §6.46) builds too

  e2e:                                       # the whole app end to end (e2e/README.md): the jar serving the built frontend on a scratch vault, driven by Chrome at PC and iPhone size
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build the backend jar
        working-directory: backend
        run: sh ./mvnw -B -ntp -q -DskipTests package
      - name: Build the frontend
        working-directory: frontend
        run: npm ci && npm run build
      - name: Install the suite (Google Chrome comes with the runner; Playwright's Chromium only if it is missing)
        working-directory: e2e
        run: |
          npm ci
          npm run typecheck
          if [ ! -x /opt/google/chrome/chrome ]; then
            npx playwright install --with-deps chromium
            echo "PW_CHANNEL=chromium" >> "$GITHUB_ENV"
          fi
      - name: Start NotesApp on a scratch vault (port 18570)
        working-directory: e2e
        run: npm run reset -- --prod
      - name: API, PC and iPhone tests
        working-directory: e2e
        run: npm test
      - name: Stop NotesApp
        if: always()
        working-directory: e2e
        run: npm run stop
      - name: Keep the report, traces and server log of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          include-hidden-files: true
          path: |
            e2e/playwright-report/
            e2e/test-results/
            e2e/.run/*.log
          retention-days: 14

  clipper:                                   # the web clipper (ROADMAP item 19): extension, bookmarklet, Shortcut script
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: clipper } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clipper/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-scripts:                            # deploy/backup runs only on homeserver: test it here, in its own images
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --shell=sh --severity=warning deploy/backup/*.sh deploy/backup/test/*.sh deploy/backup/test/fake-bin/*
      - name: CasaOS composes (every deploy/casaos-*.yml valid, and pinned to the images Dependabot keeps current in docker-compose.yml)
        run: |
          for f in deploy/casaos-*.yml; do docker compose -f "$f" config --quiet; done
          for image in $(sed -n 's/^ *image: \([^ ]*@sha256:[0-9a-f]*\).*/\1/p' deploy/casaos-*.yml); do
            grep -qF "image: $image" deploy/docker-compose.yml || { echo "::error::$image differs from deploy/docker-compose.yml"; exit 1; }
          done
      - name: nightly.sh and scheduler.sh (dash)
        run: sh deploy/backup/test/run-tests.sh sh
      - name: nightly.sh and scheduler.sh (BusyBox, in the backup-scheduler image)
        run: |
          image=$(sed -n 's/^ *image: \(docker:[^ ]*\).*/\1/p' deploy/docker-compose.yml)
          docker run --rm -v "$PWD/deploy/backup:/backup:ro" --entrypoint sh "$image" /backup/test/run-tests.sh sh
      - name: restic-job.sh against restic (in the backup image)
        run: |
          image=$(sed -n 's/^ *image: \(restic\/restic:[^ ]*\).*/\1/p' deploy/docker-compose.yml)
          docker run --rm -v "$PWD/deploy/backup:/backup:ro" --entrypoint sh "$image" /backup/test/restic-job-test.sh

  docker-build:                              # the Dockerfile is tested before anything reaches main: pull requests and "Run workflow" on build/next
    if: github.ref != 'refs/heads/main'      # on main, publish.yml builds the image itself
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  publish:
    needs: [backend, backend-jdk25, frontend, clipper, e2e]   # e2e: 88 tests green in 3 of 3 CI runs and every local run (2026-11-02), about 4 minutes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'   # push, weekly schedule, manual
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
