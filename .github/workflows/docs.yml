name: Docs contract
# CI skips docs-only pushes to main, so they do not restart production (ci.yml push.paths). Two docs are read by
# tests, though: API.md §17 must equal frontend/src/api/types.ts, and ThreatModelDocTest checks SECURITY.md. This runs
# only those tests when either doc changes, so a drift fails here and not on the next, unrelated code push.
# It publishes nothing.
on:
  push:
    branches: [main]
    paths: ['docs/API.md', 'docs/SECURITY.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  api-types:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx vitest run src/api/types.test.ts

  threat-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sh ./mvnw -B -ntp test -Dtest=ThreatModelDocTest
