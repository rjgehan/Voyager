# Packaging (ROADMAP item 41, docs/DESKTOP.md): a Windows NSIS installer and an unsigned macOS dmg.
# The UI comes from the server, so the package holds only the shell in src/.
#
# The app was called NotesApp until 1.1.0 (ROADMAP item 45). appId must never change: the installer's
# registry keys (install location, uninstall entry) are derived from it, so Voyager-Setup finds the
# NotesApp install, runs its uninstaller (which removes NotesApp.exe and the NotesApp shortcuts and keeps
# the user data), installs into the same folder and takes over the same Apps entry. The Windows taskbar
# and notifications know the app by it too (app.setAppUserModelId in main.js).
appId: com.rjgehan.notesapp.desktop
productName: Voyager
copyright: Copyright © rjgehan. GPL-3.0-only.
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  - "!**/*.test.js"
asar: true
electronLanguages: [en-US]

win:
  target: [nsis]
  # The disc alone, transparent; 16 to 48 px are the simplified drawing (scripts/brand/render-icons.mjs).
  icon: build/icon.ico
  artifactName: Voyager-Setup-${version}.${ext}
  # Not code-signed: Windows SmartScreen asks once ("More info" › "Run anyway").
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Voyager
  # Keeps the window state and server setting when the app is removed and reinstalled.
  deleteAppDataOnUninstall: false

mac:
  target:
    - target: dmg
      arch: [universal]
  icon: build/icon.png
  category: public.app-category.productivity
  artifactName: Voyager-${version}-mac.${ext}
  # Unsigned and not notarised: ad-hoc signed only, so Apple Silicon runs it. Gatekeeper steps in docs/DESKTOP.md.
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
dmg:
  title: Voyager ${version}
