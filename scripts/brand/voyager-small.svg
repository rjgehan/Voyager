<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Voyager's icon simplified for 16 to 48 px (favicon, tray, small Windows icons): the same disc
       as voyager.svg, a little bigger, with its grooves as one darker band, a lighter label, a
       bigger spindle hole and a stronger sheen; no stars, no pulsar map.
       Full bleed: render-icons.mjs rounds the corners. -->
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0726"/>
      <stop offset="0.45" stop-color="#1a1150"/>
      <stop offset="1" stop-color="#4b2bb5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0.12" y1="0.06" x2="0.88" y2="0.96">
      <stop offset="0" stop-color="#fff2c4"/>
      <stop offset="0.3" stop-color="#f5cf74"/>
      <stop offset="0.7" stop-color="#d9a03a"/>
      <stop offset="1" stop-color="#a26a1a"/>
    </linearGradient>
    <clipPath id="disc"><circle cx="32" cy="32" r="25"/></clipPath>
  </defs>
  <rect width="64" height="64" fill="url(#space)"/>
  <circle cx="32" cy="32" r="27.5" fill="#8a5cf5" opacity="0.35"/>
  <circle cx="32" cy="32" r="25" fill="url(#gold)"/>
  <circle cx="32" cy="32" r="16.5" fill="none" stroke="#7a4a10" stroke-opacity="0.38" stroke-width="10"/>
  <g clip-path="url(#disc)">
    <path d="M32,32 L6,17 L17,6 Z M32,32 L58,47 L47,58 Z" fill="#fffbe8" opacity="0.32"/>
  </g>
  <circle cx="32" cy="32" r="24.3" fill="none" stroke="#6a3f0a" stroke-opacity="0.5" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="4.2" fill="#160e40"/>
</svg>
