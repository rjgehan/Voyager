<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Voyager's icon simplified for 16 to 48 px (favicon, tray, small Windows icons): the same
       space, beam and dot as voyager.svg, with a wider, brighter beam, a bigger dot and no stars.
       Full bleed: render-icons.mjs rounds the corners. -->
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08061f"/>
      <stop offset="0.45" stop-color="#16104a"/>
      <stop offset="1" stop-color="#4b2bb5"/>
    </linearGradient>
    <linearGradient id="beamAcross" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffeedd" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#fff1e2" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#fff6ec" stop-opacity="0.34"/>
      <stop offset="0.75" stop-color="#fff1e2" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffeedd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#cfe9ff" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#a9d6ff" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#9ccfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot" cx="0.42" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6f4ff"/>
      <stop offset="1" stop-color="#a8d8ff"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="url(#space)"/>
  <g transform="rotate(25 39 37.5)">
    <rect x="25" y="-40" width="28" height="160" fill="url(#beamAcross)"/>
  </g>
  <circle cx="39" cy="37.5" r="11" fill="url(#halo)"/>
  <circle cx="39" cy="37.5" r="5.6" fill="url(#dot)"/>
</svg>
